name: GitHub Copilot Setup Steps
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Weekly validation

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    name: Setup R Environment for GitHub Copilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            wget \
            git \
            build-essential \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libssh2-1-dev \
            software-properties-common \
            dirmngr \
            gpg-agent

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.2"
          use-public-rspm: true

      - name: Configure R repository
        run: |
          echo 'options(repos = c(CRAN = "https://cran.rstudio.com/"))' | sudo tee -a /usr/lib/R/etc/Rprofile.site

      - name: Install required R packages (core dependencies)
        run: |
          Rscript -e "install.packages('R6', repos='https://cran.rstudio.com/', dependencies=TRUE)"
          Rscript -e "install.packages('uuid', repos='https://cran.rstudio.com/', dependencies=TRUE)"
          Rscript -e "install.packages('processx', repos='https://cran.rstudio.com/', dependencies=TRUE)"
          Rscript -e "install.packages('evaluate', repos='https://cran.rstudio.com/', dependencies=TRUE)"
          Rscript -e "install.packages('here', repos='https://cran.rstudio.com/', dependencies=TRUE)"

      - name: Install messaging and async packages
        run: |
          Rscript -e "install.packages('nanonext', repos='https://cran.rstudio.com/', dependencies=TRUE)"
          Rscript -e "install.packages('mirai', repos='https://cran.rstudio.com/', dependencies=TRUE)"

      - name: Install suggested packages
        run: |
          Rscript -e "install.packages(c('pryr', 'testthat'), repos='https://cran.rstudio.com/', dependencies=TRUE)"

      - name: Install R development tools
        run: |
          Rscript -e "install.packages(c('devtools', 'roxygen2', 'pkgdown', 'lintr', 'remotes'), repos='https://cran.rstudio.com/', dependencies=TRUE)"

      - name: Verify package installation
        run: |
          Rscript -e "
          cat('Required packages installed:\n')
          required <- c('mirai', 'nanonext', 'processx', 'evaluate', 'R6', 'uuid')
          sapply(required, function(x) {
            if(requireNamespace(x, quietly=TRUE)) {
              cat(x, ':', as.character(packageVersion(x)), '\n')
            } else {
              stop('Package ', x, ' not found')
            }
          })
          "

      - name: Test environment setup
        run: |
          if [ -f .devcontainer/test-environment.R ]; then
            Rscript .devcontainer/test-environment.R
          else
            echo "Test script not found, running basic validation"
            Rscript -e "
            cat('=== Basic Environment Validation ===\n')
            cat('R version:', R.version.string, '\n')
            required <- c('mirai', 'nanonext', 'processx', 'evaluate', 'R6', 'uuid')
            for (pkg in required) {
              if (requireNamespace(pkg, quietly = TRUE)) {
                cat(sprintf('✓ %s: %s\n', pkg, packageVersion(pkg)))
              } else {
                cat(sprintf('✗ %s: NOT FOUND\n', pkg))
                quit(status = 1)
              }
            }
            cat('Environment setup successful!\n')
            "
          fi
